name: Scrape Prices

on:
  schedule:
    # Runs every day at 2am NZT (1pm UTC)
    - cron: '0 13 * * *'
  workflow_dispatch: # also allows manual trigger from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to commit products.json back to repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run scraper
        run: node scraper.js

      - name: Commit updated products.json
        run: |
          git config user.name  "ScoopScore Bot"
          git config user.email "bot@scoopscore.co.nz"
          git add data/products.json data/scrape.log
          git diff --staged --quiet || git commit -m "chore: update prices $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
